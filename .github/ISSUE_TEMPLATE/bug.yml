name: Bug report
description: Report a reproducible problem in the explorer, node inspector, or API.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Genosphere. Please remove secrets and personal data from screenshots and logs.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched for an existing issue and removed secrets or personal data.
          required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected instead.
      placeholder: Selecting ... causes ...; I expected ...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Search for ...
        3. Select ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - Site or commit:
        - Browser and operating system:
        - Screen or viewport size:
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, logs, or additional context
      description: Drag files here if useful. Redact secrets and personal data.
